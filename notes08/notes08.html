<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator!</title>
    <script src="script.js" defer></script>
    <style>
    /* The magic line that enables automatic browser dark mode */
    html {
      color-scheme: light dark;
    }
    
    /* Optional: Just add a little padding to make it look clean */
    body {
      font-family: sans-serif;
      padding: 20px;
    }
  </style>
</head>
<body>
    <h1>Mini Calculator!</h1>
    <form id="calculator">
        <label for="first-number">First number:</label>
        <input id="first-number" type="number" step="any" required>

        <label for="operation">Operation:</label>
        <select id="operation">
            <option value="add">Add (+)</option>
            <option value="subtract">Subtract (-)</option>
            <option value="multiply">Multiply (*)</option>
            <option value="divide">Divide (/)</option>
        </select>

        <label for="second-number">Second number:</label>
        <input id="second-number" type="number" step="any" required>

        <button type="submit">Calculate</button>
    </form>

    <p id="result" aria-live="polite">Enter two numbers to get started.</p>

    <!-- The magic button -->
    <button onclick="document.body.style.backgroundColor = document.body.style.backgroundColor === 'black' ? 'white' : 'black'; document.body.style.color = document.body.style.color === 'white' ? 'black' : 'white';">
    Switch Mode
    </button>

    <p>© <script>document.write(new Date().getFullYear())</script> Roy Badillo Site</p>

</body>
</html>
